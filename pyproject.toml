[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tempokv"
version = "0.1.0"
description = "Predictive residual quantization for KV caches"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.24",
  "torch>=2.2",
]

[project.optional-dependencies]
cuda = ["triton>=2.2"]
test = ["pytest>=8"]
metrics = [
  "lpips>=0.1.4",
  "opencv-python>=4.8",
  "scikit-image>=0.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
