{
  "source": "bf16",
  "experiments": ["spectrum", "sensitivity", "compression"],
  "seed": 42,
  "sampling": {
    "layers": [0, 15, 29],
    "heads": [0, 6],
    "latent_frames": [12, 24, 36],
    "denoise_calls": [0],
