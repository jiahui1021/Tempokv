[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tempokv"
version = "0.1.0"
description = "Predictive residual quantization for KV caches"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.24",
  "torch>=2.2",
]

[project.optional-dependencies]
spectral = ["PyYAML>=6.0", "matplotlib>=3.7"]
research = ["PyYAML>=6.0", "matplotlib>=3.7"]
cuda = ["triton>=2.2"]
self-forcing = [
  "accelerate>=1.1.1",
  "av==13.1.0",
  "diffusers==0.31.0",
  "easydict>=1.13",
  "einops>=0.8.0",
  "ftfy>=6.2.0",
  "imageio>=2.34",
  "omegaconf>=2.3.0",
  "Pillow>=10.0",
  "regex>=2024.0",
  "scipy>=1.10",
  "sentencepiece>=0.2.0",
  "tokenizers>=0.20.3",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "tqdm>=4.66",
  "transformers>=4.49.0",
]
self-forcing-train = [
  "dashscope",
  "lmdb",
  "matplotlib",
  "open_clip_torch",
  "pycocotools",
  "wandb",
]
longcat = [
  "av==12.0.0",
  "diffusers==0.35.1",
  "einops==0.8.0",
  "flash-attn==2.7.4.post1",
  "ftfy==6.2.0",
  "loguru==0.7.2",
  "Pillow>=10.0",
  "regex>=2024.0.0",
  "safetensors>=0.4",
  "torchvision>=0.21",
  "tqdm>=4.66",
  "transformers==4.41.0",
  "triton>=3.0",
]
causal-forcing = [
  "accelerate>=1.1.1",
  "av==13.1.0",
  "diffusers==0.31.0",
  "easydict>=1.13",
  "einops>=0.8.0",
  "ftfy>=6.2.0",
  "imageio>=2.34",
  "omegaconf>=2.3.0",
  "Pillow>=10.0",
  "regex>=2024.0",
  "safetensors>=0.4",
  "scipy>=1.10",
  "sentencepiece>=0.2.0",
  "tokenizers>=0.20.3",
  # Causal Forcing compiles torch.nn.attention.flex_attention; 2.5 is the
  # oldest release where the compiled path is stable for Wan2.1-1.3B.
  "torch>=2.5.0",
  "torchvision>=0.20.0",
  "tqdm>=4.66",
  "transformers>=4.49.0",
]
metrics = [
  "lpips>=0.1.4",
  "opencv-python>=4.8",
  "scikit-image>=0.22",
  "torch-fidelity>=0.3.0",
  "torchmetrics>=1.3",
]

[tool.setuptools.packages.find]
where = ["src", "experiments/LongCat", "experiments/Causal-Forcing"]
include = ["tempokv*", "longcat*", "longcat_video*", "causal_forcing*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src", "experiments/LongCat", "experiments/Causal-Forcing"]
